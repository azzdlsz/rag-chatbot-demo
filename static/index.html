<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocChat – RAG Chatbot Demo</title>
<style>
:root{--bg:#0f172a;--panel:#111827;--card:#1f2937;--txt:#e5e7eb;--mut:#9ca3af;--acc:#6366f1}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);display:flex;height:100vh}
aside{width:300px;background:var(--panel);padding:20px;border-right:1px solid #263041;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0}.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:#374151;color:var(--mut)}
.drop{border:2px dashed #374151;border-radius:12px;padding:18px;text-align:center;color:var(--mut);cursor:pointer}
.drop.over{border-color:var(--acc);color:var(--txt)}
ul{list-style:none;padding:0;margin:0;overflow:auto}li{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px}
li button{background:none;border:0;color:var(--mut);cursor:pointer}
main{flex:1;display:flex;flex-direction:column}#log{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:760px;padding:12px 16px;border-radius:14px;line-height:1.5;white-space:pre-wrap}
.user{align-self:flex-end;background:var(--acc)}.bot{align-self:flex-start;background:var(--card)}
details{margin-top:8px;font-size:12px;color:var(--mut)}
form{display:flex;gap:10px;padding:16px;border-top:1px solid #263041}
input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid #374151;background:var(--card);color:var(--txt);font-size:15px}
form button{padding:0 20px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
#demo-banner{position:fixed;top:0;left:0;right:0;z-index:99;background:#fff3cd;color:#664d03;text-align:center;padding:6px;font:13px sans-serif;display:none}
</style></head><body>
<div id="demo-banner">🧪 Public demo running in offline mock mode (no real LLM). Uploads are shared &amp; temporary — don't upload private files. <a href="https://github.com/azzdlsz/rag-chatbot-demo">Source on GitHub</a></div>
<script>fetch('/health').then(r=>r.json()).then(h=>{if(h.public_demo||h.mode==='mock'){const b=document.getElementById('demo-banner');b.style.display='block';document.body.style.paddingTop='32px'}})</script>
<aside><h1>📄 DocChat</h1><span id="mode" class="badge">…</span>
<label class="drop" id="drop">Drop PDF / TXT / MD here<br>or click to upload<input type="file" id="file" accept=".pdf,.txt,.md" hidden multiple></label>
<strong style="font-size:13px">Knowledge base</strong><ul id="docs"></ul></aside>
<main><div id="log"><div class="msg bot">Hi! Ask me anything about the documents in the knowledge base.</div></div>
<form id="f"><input id="q" placeholder="Ask a question…" autocomplete="off"><button>Send</button></form></main>
<script>
const $=s=>document.querySelector(s),history=[];
async function refresh(){const h=await (await fetch('/health')).json();$('#mode').textContent=h.mode==='mock'?'Mock mode (no API key)':'OpenAI mode';
const d=await (await fetch('/api/documents')).json();$('#docs').innerHTML=d.map(x=>`<li><span>${x.name} <small style="color:#9ca3af">(${x.chunks})</small></span><button data-n="${encodeURIComponent(x.name)}">✕</button></li>`).join('')||'<li>No documents yet</li>'}
$('#docs').onclick=async e=>{const n=e.target.dataset.n;if(n){await fetch('/api/documents/'+n,{method:'DELETE'});refresh()}};
async function upload(files){for(const f of files){const fd=new FormData();fd.append('file',f);const r=await fetch('/api/documents',{method:'POST',body:fd});if(!r.ok)alert((await r.json()).detail)}refresh()}
$('#file').onchange=e=>upload(e.target.files);const dr=$('#drop');
dr.ondragover=e=>{e.preventDefault();dr.classList.add('over')};dr.ondragleave=()=>dr.classList.remove('over');
dr.ondrop=e=>{e.preventDefault();dr.classList.remove('over');upload(e.dataTransfer.files)};
function add(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;$('#log').append(d);$('#log').scrollTop=1e9;return d}
$('#f').onsubmit=async e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;$('#q').value='';add('user',q);const b=add('bot','Thinking…');
try{const r=await (await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history})})).json();
b.textContent=r.answer;history.push({role:'user',content:q},{role:'assistant',content:r.answer});
if(r.sources?.length){const det=document.createElement('details');det.innerHTML='<summary>Sources</summary>'+r.sources.map(s=>`<p><b>[${s.n}] ${s.source}</b> (score ${s.score})<br>${s.text.replace(/</g,'&lt;')}…</p>`).join('');b.append(det)}}
catch(err){b.textContent='Error: '+err}};
refresh();
</script></body></html>
